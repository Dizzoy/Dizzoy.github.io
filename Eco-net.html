<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Net: Global Cleanup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; }
        #video-feed { transform: scaleX(-1); display: none; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* Centered Timer Styling */
        #timer-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 99px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: monospace;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #timer-display.visible { opacity: 1; }

        .score-card { font-size: 2rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #qr-container { 
            position: absolute; bottom: 20px; right: 20px; 
            background: white; padding: 12px; border-radius: 12px; 
            pointer-events: auto; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        #qr-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
        }
        .environment-bg {
            position: absolute; width: 100%; height: 100%;
            transition: background 2s ease;
            z-index: -1;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95); padding: 2.5rem; border-radius: 1.5rem;
            z-index: 100; pointer-events: auto; text-align: center;
            width: 90%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .bubble {
            position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50%;
            pointer-events: none; bottom: -100px; animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            from { transform: translateY(0); }
            to { transform: translateY(-120vh); }
        }
        .progress-ring { transition: stroke-dashoffset 0.1s linear; }
    </style>
</head>
<body>

<div id="game-container">
    <video id="video-feed" autoplay playsinline></video>
    <div id="bg-layer" class="environment-bg"></div>
    
    <canvas id="game-canvas"></canvas>
    <canvas id="tracking-canvas" style="opacity: 0.1;"></canvas>

    <div class="ui-layer p-8">
        <!-- Centered Timer -->
        <div id="timer-display">
            <span class="text-xs uppercase tracking-widest block opacity-70">Time Remaining</span>
            <span id="timer-val" class="text-4xl font-bold text-yellow-400">60</span><span class="text-xl">s</span>
        </div>

        <div class="flex justify-between items-start">
            <div class="score-card">
                <h1 class="text-4xl font-bold tracking-tight">ECO-NET COLLAB</h1>
                <p class="mt-2 font-mono">Pollution: <span id="score-val" class="text-green-400">0</span> kg</p>
            </div>
            
            <div id="qr-container">
                <img id="qr-image" src="color.png" alt="Scan to join">
                <p class="text-xs mt-2 text-black font-bold tracking-widest uppercase">Scan to Join</p>
            </div>
        </div>
    </div>

    <!-- Start Interaction Modal -->
    <div id="setup-modal" class="modal">
        <h2 class="text-3xl font-bold mb-4 text-slate-800">Ready to Clean?</h2>
        <p class="mb-6 text-slate-600">Hold any colored net over the button for 5 seconds to start!</p>
        
        <div id="start-button-area" class="relative w-48 h-48 mx-auto flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full -rotate-90">
                <circle cx="96" cy="96" r="80" stroke="#e2e8f0" stroke-width="12" fill="transparent" />
                <circle id="start-progress" class="progress-ring" cx="96" cy="96" r="80" stroke="#16a34a" stroke-width="12" fill="transparent" 
                    stroke-dasharray="502.6" stroke-dashoffset="502.6" />
            </svg>
            <div class="z-10 bg-green-600 text-white w-32 h-32 rounded-full flex flex-col items-center justify-center shadow-inner">
                <span class="font-bold text-lg">HOLD</span>
                <span id="hold-countdown" class="text-2xl font-black">5.0s</span>
            </div>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div id="result-modal" class="modal hidden">
        <h2 class="text-4xl font-black mb-2 text-slate-800">ROUND COMPLETE!</h2>
        <p class="text-xl text-slate-600 mb-6">Environment Status: <span id="env-status" class="font-bold">Partially Cleaned</span></p>
        <div class="bg-slate-100 p-6 rounded-2xl mb-6">
            <p class="text-sm uppercase tracking-widest text-slate-500 font-bold">Total Pollution Removed</p>
            <p class="text-6xl font-black text-green-600"><span id="final-score">0</span><span class="text-2xl">kg</span></p>
        </div>
        <p class="text-slate-400 text-sm italic">Next round starts automatically in 8 seconds...</p>
    </div>
</div>

<script>
    // Audio Assets
    const sfxStart = new Audio('game start.mp3');
    const sfxGetPoint = new Audio('get point.wav');
    const sfxLossPoint = new Audio('loss point.mp3');
    const sfxEnd = new Audio('game end.mp3');

    const video = document.getElementById('video-feed');
    const gameCanvas = document.getElementById('game-canvas');
    const trackCanvas = document.getElementById('tracking-canvas');
    const bgLayer = document.getElementById('bg-layer');
    const scoreVal = document.getElementById('score-val');
    const timerVal = document.getElementById('timer-val');
    const timerDisplay = document.getElementById('timer-display');
    const ctx = gameCanvas.getContext('2d');
    const tCtx = trackCanvas.getContext('2d');

    const setupModal = document.getElementById('setup-modal');
    const resultModal = document.getElementById('result-modal');
    const startProgressRing = document.getElementById('start-progress');
    const holdCountdownText = document.getElementById('hold-countdown');

    let score = 0;
    let items = [];
    let gameState = 'SETUP'; 
    let roundTimeLeft = 60;
    let holdStartTime = 0;
    const HOLD_DURATION = 5000; 
    const ROUND_DURATION = 60; 
    const RESULT_DURATION = 8000; 

    let players = {
        red: { x: 0, y: 0, active: false, color: '#ef4444', h: [340, 20] },
        green: { x: 0, y: 0, active: false, color: '#22c55e', h: [90, 150] },
        blue: { x: 0, y: 0, active: false, color: '#3b82f6', h: [190, 250] },
        yellow: { x: 0, y: 0, active: false, color: '#eab308', h: [45, 75] }
    };

    const TRASH_TYPES = ['🥤', '🧴', '🛍️', '📦', '🛢️'];
    const BOMB_TYPES = ['🐠', '🐢', '🐬']; 

    function resize() {
        gameCanvas.width = trackCanvas.width = window.innerWidth;
        gameCanvas.height = trackCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function createAmbientBubbles() {
        for(let i=0; i<15; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 40 + 10;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`;
            bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            bgLayer.appendChild(bubble);
        }
    }
    createAmbientBubbles();

    window.onload = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480, facingMode: 'user' } 
            });
            video.srcObject = stream;
            gameLoop();
        } catch (err) {
            console.error("Camera access denied", err);
        }
    };

    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        roundTimeLeft = ROUND_DURATION;
        items = [];
        setupModal.classList.add('hidden');
        resultModal.classList.add('hidden');
        timerDisplay.classList.add('visible'); // Show centered timer
        updateEnvironment();
        
        sfxStart.play().catch(e => console.log("Audio play blocked"));

        const timerInterval = setInterval(() => {
            if (gameState !== 'PLAYING') {
                clearInterval(timerInterval);
                return;
            }
            roundTimeLeft--;
            timerVal.innerText = roundTimeLeft;
            if (roundTimeLeft <= 0) {
                endRound();
            }
        }, 1000);
    }

    function endRound() {
        gameState = 'RESULT';
        timerDisplay.classList.remove('visible'); // Hide timer
        document.getElementById('final-score').innerText = score;
        document.getElementById('env-status').innerText = score > 500 ? "Restored" : "Partially Cleaned";
        resultModal.classList.remove('hidden');
        
        sfxEnd.play().catch(e => console.log("Audio play blocked"));

        setTimeout(() => {
            resetToSetup();
        }, RESULT_DURATION);
    }

    function resetToSetup() {
        gameState = 'SETUP';
        resultModal.classList.add('hidden');
        setupModal.classList.remove('hidden');
        holdStartTime = 0;
        updateStartProgress(0);
        score = 0;
        updateEnvironment();
    }

    function updateStartProgress(progress) {
        const offset = 502.6 - (progress * 502.6);
        startProgressRing.style.strokeDashoffset = offset;
        holdCountdownText.innerText = (Math.max(0, (HOLD_DURATION - (progress * HOLD_DURATION))/1000)).toFixed(1) + 's';
    }

    function spawnItem() {
        if (Math.random() < 0.05) {
            const isTrash = Math.random() > 0.25;
            items.push({
                x: Math.random() * gameCanvas.width,
                y: gameCanvas.height + 50,
                vx: (Math.random() - 0.5) * 6,
                vy: -Math.random() * 14 - 10,
                type: isTrash ? TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)] : BOMB_TYPES[Math.floor(Math.random() * BOMB_TYPES.length)],
                isTrash: isTrash,
                radius: 60,
                angle: 0,
                rotation: (Math.random() - 0.5) * 0.15
            });
        }
    }

    function processTracking() {
        tCtx.save();
        tCtx.scale(-1, 1);
        tCtx.translate(-trackCanvas.width, 0);
        tCtx.drawImage(video, 0, 0, trackCanvas.width, trackCanvas.height);
        tCtx.restore();

        const frame = tCtx.getImageData(0, 0, trackCanvas.width, trackCanvas.height);
        const data = frame.data;

        Object.keys(players).forEach(p => { 
            players[p].count = 0; players[p].sumX = 0; players[p].sumY = 0; 
        });

        for (let i = 0; i < data.length; i += 64) { 
            const r = data[i], g = data[i+1], b = data[i+2];
            const [h, s, l] = rgbToHsl(r, g, b);

            if (s > 45 && l > 15 && l < 85) {
                for (const [key, p] of Object.entries(players)) {
                    const match = (p.h[0] < p.h[1]) 
                        ? (h >= p.h[0] && h <= p.h[1])
                        : (h >= p.h[0] || h <= p.h[1]);
                    
                    if (match) {
                        p.sumX += (i / 4) % trackCanvas.width;
                        p.sumY += Math.floor((i / 4) / trackCanvas.width);
                        p.count++;
                        break;
                    }
                }
            }
        }

        let playerOverButton = false;
        Object.keys(players).forEach(key => {
            const p = players[key];
            if (p.count > 5) {
                p.active = true;
                const targetX = (p.sumX / p.count) * (gameCanvas.width / trackCanvas.width);
                const targetY = (p.sumY / p.count) * (gameCanvas.height / trackCanvas.height);
                p.x += (targetX - p.x) * 0.4;
                p.y += (targetY - p.y) * 0.4;

                if (gameState === 'SETUP') {
                    const btnRect = document.getElementById('start-button-area').getBoundingClientRect();
                    if (p.x > btnRect.left && p.x < btnRect.right && p.y > btnRect.top && p.y < btnRect.bottom) {
                        playerOverButton = true;
                    }
                }
            } else {
                p.active = false;
            }
        });

        if (gameState === 'SETUP') {
            if (playerOverButton) {
                if (holdStartTime === 0) holdStartTime = Date.now();
                const elapsed = Date.now() - holdStartTime;
                updateStartProgress(Math.min(1, elapsed / HOLD_DURATION));
                if (elapsed >= HOLD_DURATION) startGame();
            } else {
                holdStartTime = 0;
                updateStartProgress(0);
            }
        }
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return [h * 360, s * 100, l * 100];
    }

    function update() {
        processTracking();
        if (gameState !== 'PLAYING') return;

        spawnItem();
        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            item.x += item.vx;
            item.y += item.vy;
            item.vy += 0.25; 
            item.angle += item.rotation;

            Object.values(players).forEach(p => {
                if (p.active) {
                    const dist = Math.hypot(item.x - p.x, item.y - p.y);
                    if (dist < item.radius + 35) {
                        if (item.isTrash) {
                            score += 10;
                            sfxGetPoint.cloneNode().play(); // clone to allow rapid firing
                        } else {
                            score = Math.max(0, score - 50);
                            sfxLossPoint.cloneNode().play();
                        }
                        items.splice(i, 1);
                        updateEnvironment();
                    }
                }
            });

            if (item.y > gameCanvas.height + 150) items.splice(i, 1);
        }
    }

    function updateEnvironment() {
        scoreVal.innerText = score;
        const cleanProgress = Math.min(100, score / 15);
        const startColor = [30, 41, 59];
        const endColor = [14, 165, 233];
        const r = Math.round(startColor[0] + (endColor[0] - startColor[0]) * (cleanProgress / 100));
        const g = Math.round(startColor[1] + (endColor[1] - startColor[1]) * (cleanProgress / 100));
        const b = Math.round(startColor[2] + (endColor[2] - startColor[2]) * (cleanProgress / 100));
        bgLayer.style.background = `radial-gradient(circle at center, rgb(${r}, ${g}, ${b}) 0%, #0f172a 100%)`;
    }

    function draw() {
        ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
        if (gameState !== 'PLAYING' && gameState !== 'SETUP') return;

        ctx.font = '90px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        items.forEach(item => {
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.rotate(item.angle);
            ctx.fillText(item.type, 0, 0);
            ctx.restore();
        });

        Object.keys(players).forEach(key => {
            const p = players[key];
            if (p.active) {
                const grad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, 60);
                grad.addColorStop(0, p.color + '88');
                grad.addColorStop(1, 'transparent');
                ctx.beginPath(); ctx.arc(p.x, p.y, 60, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
                ctx.beginPath(); ctx.arc(p.x, p.y, 45, 0, Math.PI * 2); ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(key.toUpperCase(), p.x, p.y - 75);
            }
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
