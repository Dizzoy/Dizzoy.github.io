<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eco-Saver: Billboard Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Inter', sans-serif; background: #020617; color: white; 
            height: 100%; width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-container { 
            position: relative; 
            height: 100vh; 
            width: calc(100vh * 9 / 16);
            max-width: 100vw;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(34, 197, 94, 0.3);
            border-left: 1px solid rgba(0,0,0,0.1);
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        
        @media (aspect-ratio: 16/9), (min-aspect-ratio: 1/1) {
            #video-container {
                height: 100vh;
                width: calc(100vh * 9 / 16);
            }
        }

        video { 
            position: absolute; 
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%) scaleX(-1); 
            object-fit: cover; 
            opacity: 0.45; 
            z-index: 1;
        }
        
        canvas { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; 
            pointer-events: none;
        }
        
        /* Custom Pattern based on user image_78142c.jpg */
        .eco-bg {
            background-color: #ffffff;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 80 Q30 50 20 50 Q30 50 30 20 Q30 50 40 50 Q30 50 30 80' stroke='%2386efac' fill='none' stroke-width='1.5'/%3E%3Ccircle cx='70' cy='30' r='12' fill='%23dcfce7' stroke='%234ade80' stroke-width='1'/%3E%3Cpath d='M70 42 L70 70' stroke='%234ade80' stroke-width='1.5'/%3E%3Cpath d='M10 20 L15 18 M85 80 L90 78' stroke='%23334155' stroke-width='0.5'/%3E%3C/svg%3E");
            background-size: 150px 150px;
        }

        #ui-layer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; 
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pointer-events-auto { pointer-events: auto; }
        
        #controller-view { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #00FF00;
            z-index: 100; display: none; flex-direction: column; 
            align-items: center; justify-content: center;
        }

        .font-outline-2 {
            -webkit-text-stroke: 1.5px rgba(22, 163, 74, 1);
            color: transparent;
        }

        #start-progress-bar {
            transition: width 0.1s linear;
        }

        #combo-container {
            position: absolute;
            top: 140px;
            right: 20px;
            width: 100px; 
            z-index: 40; 
        }

        .tabular {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }
        
        .ui-panel {
            width: 85%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game-dimmer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.4);
            z-index: 2;
            transition: opacity 0.5s;
        }

        .earth-avatar {
            font-size: 8rem;
            margin-bottom: 1rem;
            transition: all 0.5s ease;
            line-height: 1;
        }
        
        .earth-sad { 
            filter: grayscale(1) sepia(0.8) contrast(1.2) brightness(0.6); 
            animation: shake 0.5s infinite; 
            opacity: 0.85;
        }
        .earth-neutral { filter: none; }
        .earth-happy { filter: drop-shadow(0 0 30px #22c55e); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px) rotate(-1deg); }
            75% { transform: translateX(4px) rotate(1deg); }
        }
    </style>
</head>
<body>

<div id="controller-view">
    <div class="text-black font-bold text-center px-6">
        <h1 class="text-6xl mb-6 font-black tracking-tighter">SAVER</h1>
        <p class="text-xl">Face this screen towards the billboard!</p>
        <div class="text-9xl animate-bounce mt-10">♻️</div>
    </div>
</div>

<div id="video-container">
    <div id="home-bg" class="absolute inset-0 eco-bg z-0"></div>
    <div id="game-dim" class="game-dimmer opacity-0"></div>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- Home State -->
        <div id="home-screen" class="pointer-events-auto bg-white/90 backdrop-blur-md p-8 rounded-[3rem] border-4 border-green-500/30 ui-panel shadow-xl text-center">
            <div class="bg-green-600 text-white text-[10px] font-black px-3 py-1 rounded-full inline-block mb-6 tracking-widest uppercase">Multiplayer Ready</div>
            
            <h1 class="text-4xl font-black text-slate-800 leading-none uppercase mb-6">
                <div class="mb-1">Eco</div>
                <div class="text-green-600 font-outline-2">Saver</div>
            </h1>
            
            <!-- Static Image QR Code -->
            <div class="flex justify-center mb-8 p-4 bg-white border-2 border-slate-100 rounded-3xl shadow-sm">
                <img src="qr-eco-saver.png" alt="Scan to Play" style="width: 160px; height: 160px; object-fit: contain;">
            </div>
            
            <div class="space-y-4 w-full flex flex-col items-center">
                <p class="text-slate-500 text-[11px] font-bold uppercase tracking-widest">Hover Green Ball Below to Start</p>
                <div id="start-bar-container" class="w-full h-10 bg-slate-100 rounded-2xl overflow-hidden relative border border-slate-200">
                    <div id="start-progress-bar" class="h-full bg-orange-500 w-0"></div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="text-[9px] font-black uppercase text-slate-400 tracking-tighter">IGNITION SENSOR ACTIVE</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Countdown -->
        <div id="countdown-screen" class="hidden flex-col items-center justify-center">
            <div id="countdown-timer" class="text-[15rem] font-black text-white drop-shadow-2xl leading-none">5</div>
            <p class="text-3xl text-orange-500 font-black uppercase tracking-[0.2em] mt-4">Ignition!</p>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden absolute top-0 left-0 w-full p-8 flex flex-col gap-4">
            <div class="flex justify-between items-center w-full gap-3 text-center">
                <div class="flex-1 bg-black/60 backdrop-blur-md px-4 py-4 rounded-3xl border-b-4 border-green-500 flex flex-col items-center justify-center">
                    <div class="text-[10px] text-green-400 font-black uppercase tracking-widest mb-1">Score</div>
                    <div id="score-val" class="text-3xl font-black text-white tabular">0</div>
                </div>
                <div class="flex-1 bg-black/60 backdrop-blur-md px-4 py-4 rounded-3xl border-b-4 border-blue-500 flex flex-col items-center justify-center">
                    <div class="text-[10px] text-blue-400 font-black uppercase tracking-widest mb-1">Time</div>
                    <div id="timer-val" class="text-3xl font-black text-white tabular">30</div>
                </div>
            </div>
            
            <div id="combo-container" class="opacity-0 transition-opacity duration-300 bg-black/60 backdrop-blur-md p-2 rounded-xl border border-white/10 flex flex-col items-center">
                <div class="flex flex-col w-full items-center mb-1">
                    <span id="combo-multiplier" class="text-green-400 font-black text-lg leading-none">1.0x</span>
                    <span id="combo-count" class="text-white text-[7px] font-bold uppercase tracking-widest mt-1">COMBUSTION</span>
                </div>
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                    <div id="combo-timer-bar" class="h-full bg-orange-500 w-full transition-all duration-100 ease-linear"></div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden pointer-events-auto bg-slate-900/95 p-10 rounded-[3rem] border-4 border-green-500 ui-panel shadow-2xl flex-col items-center">
            <div id="earth-avatar-container" class="earth-avatar">🌍</div>
            <p id="earth-status-text" class="text-green-500 font-black tracking-widest mb-4 uppercase tracking-tighter">PLANET STATUS</p>
            
            <div class="flex flex-col items-center mb-8">
                <h2 class="text-xl font-bold text-white/40 uppercase tracking-widest text-center">Final Score</h2>
                <div id="final-score" class="text-7xl font-black text-white tabular leading-none text-center">0</div>
            </div>
