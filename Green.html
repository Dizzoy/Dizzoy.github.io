<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chroma Ball - No Sleep</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* Dark background to see the ball clearly */
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Prevents page scrolling while dragging */
        }

        #chroma-ball {
            width: 150px;
            height: 150px;
            background-color: #00b140; /* Chroma Green */
            border-radius: 50%;
            position: absolute;
            cursor: grab;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            font-size: 12px;
            color: rgba(0,0,0,0.5);
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="chroma-ball">Drag Me</div>

    <script>
        const ball = document.getElementById('chroma-ball');
        let wakeLock = null;
        let isDragging = false;

        // --- Wake Lock & Fullscreen Logic ---
        async function activateFeatures() {
            // Request Fullscreen
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            // Request Wake Lock
            if ('wakeLock' in navigator && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    ball.innerText = ""; // Hide text once active
                } catch (err) {
                    console.error(err);
                }
            }
        }

        // --- Dragging Logic ---
        ball.addEventListener('pointerdown', (e) => {
            isDragging = true;
            ball.style.cursor = 'grabbing';
            activateFeatures(); // Activate anti-dim on first touch
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            
            // Center the ball on the finger/cursor
            const x = e.clientX - ball.offsetWidth / 2;
            const y = e.clientY - ball.offsetHeight / 2;
            
            ball.style.left = `${x}px`;
            ball.style.top = `${y}px`;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            ball.style.cursor = 'grab';
        });

        // Re-lock screen if user switches back to tab
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        });
    </script>
</body>
</html>
