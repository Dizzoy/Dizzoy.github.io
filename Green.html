<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stationary Chroma Ball</title>
    <style>
        /* Force the background to stay dark and fill the screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            /* Flexbox perfectly centers the child element */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chroma-ball {
            /* Adjust size here */
            width: 200px; 
            height: 200px;
            background-color: #00b140; /* Chroma Green */
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 999;
        }

        /* Invisible overlay to catch the first tap for WakeLock */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="chroma-ball"></div>
    <div id="overlay" onclick="startFeatures()"></div>

    <script>
        let wakeLock = null;

        async function startFeatures() {
            // Remove overlay so it doesn't interfere after activation
            document.getElementById('overlay').style.display = 'none';

            // 1. Enter Fullscreen (Hides mobile address bars)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari iOS */
                document.documentElement.webkitRequestFullscreen();
            }

            // 2. Prevent Dimming
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error("WakeLock failed:", err);
                }
            }
        }

        // Keep screen awake if user switches back to the tab
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        });
    </script>
</body>
</html>
